[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/lume-conformance",
  "crates/lume-domain",
  "crates/lume-protocol",
  "crates/lume-reference-runtime",
  "crates/lume-sdk",
  "crates/lume-service",
  "crates/lume-storage",
]
default-members = [
  "crates/lume-conformance",
  "crates/lume-domain",
  "crates/lume-protocol",
  "crates/lume-reference-runtime",
  "crates/lume-sdk",
  "crates/lume-service",
  "crates/lume-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
futures = "0.3.31"
prost = "0.14.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
